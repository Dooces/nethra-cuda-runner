name: Nethra support manifestation factor audit
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_support_manifestation_factor_audit.py'
      - '.github/workflows/nethra-support-manifestation-factor-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          PYTHONPATH=. /usr/bin/time -f 'elapsed=%e maxrss_kb=%M' \
            /usr/bin/python3 nethra_support_manifestation_factor_audit.py
