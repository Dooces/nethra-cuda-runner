name: Nethra reachable-source feeding

on:
  push:
    branches:
      - nethra-feed-v3-bounded
    paths:
      - '.github/workflows/nethra-reachable-source-feeding.yml'
  workflow_dispatch:

jobs:
  reachable:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Host
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
          nvidia-smi

      - name: Map reachable contact workspace
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          cd feed_v3
          PYTHONPATH=. /usr/bin/python3 - <<'PY'
          import json, math, random
          from collections import Counter
          from world import World, MOTOR_COUNT, X_MIN, X_MAX, Y_MIN, Y_MAX

          rng=random.Random(991733)
          world=World(balls=False,source=False,energy=False)
          active=set()
          bins=Counter()
          visits=Counter()
          steps=240000
          nx=24
          ny=24
          for t in range(steps):
              for m in range(MOTOR_COUNT):
                  if rng.random()<.02:
                      if m in active: active.remove(m)
                      else: active.add(m)
              world.step({m:1.0 for m in active})
              for x,y in world.geometry():
                  ix=max(0,min(nx-1,int((x-X_MIN)/(X_MAX-X_MIN)*nx)))
                  iy=max(0,min(ny-1,int((y-Y_MIN)/(Y_MAX-Y_MIN)*ny)))
                  bins[(ix,iy)]+=1
                  visits[(ix,iy)]+=1

          ranked=sorted(bins.items(),key=lambda kv:(-kv[1],kv[0]))
          selected=[]
          min_bin_sep=4.0
          for (ix,iy),count in ranked:
              if count<100:
                  break
              if all(math.hypot(ix-jx,iy-jy)>=min_bin_sep for jx,jy,_ in selected):
                  selected.append((ix,iy,count))
              if len(selected)>=5:
                  break

          positions=[]
          for ix,iy,count in selected:
              x=X_MIN+(ix+.5)*(X_MAX-X_MIN)/nx
              y=Y_MIN+(iy+.5)*(Y_MAX-Y_MIN)/ny
              positions.append({"ix":ix,"iy":iy,"x":x,"y":y,"visits":count})

          assert len(positions)>=3, positions
          open("../benchmark-output/reachable-positions.json","w").write(json.dumps({
              "steps":steps,"positions":positions
          },indent=2)+"\n")
          print(json.dumps({"steps":steps,"positions":positions},indent=2))
          PY

      - name: Run reachable source controls
        shell: bash
        run: |
          set -euxo pipefail
          cd feed_v3
          run_capped() {
            "$@" &
            pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              rss_kb=$(awk '/VmRSS:/ {print $2}' "/proc/$pid/status" 2>/dev/null || echo 0)
              if [ "${rss_kb:-0}" -gt 4194304 ]; then
                echo "RSS safety limit exceeded: ${rss_kb} KiB" >&2
                kill -TERM "$pid" 2>/dev/null || true
                sleep 1
                kill -KILL "$pid" 2>/dev/null || true
                wait "$pid" || true
                return 99
              fi
              sleep 1
            done
            wait "$pid"
          }

          /usr/bin/python3 - <<'PY' > ../benchmark-output/positions.tsv
          import json
          d=json.load(open("../benchmark-output/reachable-positions.json"))
          for i,p in enumerate(d["positions"][:3]):
              print(f"p{i}\t{p['x']}\t{p['y']}\t{p['visits']}")
          PY

          mkdir -p ../benchmark-output/reachable
          while IFS=$'\t' read -r label sx sy visits; do
            for seed in 23001 23002 23003; do
              echo "=== $label seed=$seed source=($sx,$sy), workspace_visits=$visits ==="
              run_capped env PYTHONPATH=. /usr/bin/python3 run_feeding_cuda.py \
                --base ../benchmark-output/base_hand_ball_cuda.json \
                --steps 12000 \
                --checkpoint-every 12000 \
                --sample-rate 0.0625 \
                --proposal-budget 64 \
                --candidate-capacity 65536 \
                --persistence-floor 0.003 \
                --field-dt 0.1 \
                --basal-cost 0.00021 \
                --motor-cost 0.0000275 \
                --source-x "$sx" \
                --source-y "$sy" \
                --seed "$seed" \
                --out "../benchmark-output/reachable/${label}-${seed}.json"
            done
          done < ../benchmark-output/positions.tsv
          cd ..

      - name: Summarize reachable trials
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/python3 - <<'PY'
          import glob,json,os,statistics
          positions=json.load(open("benchmark-output/reachable-positions.json"))["positions"][:3]
          rows=[]
          for p in sorted(glob.glob("benchmark-output/reachable/*.json")):
              d=json.load(open(p))
              base=os.path.basename(p)[:-5]
              label,seed=base.rsplit("-",1)
              for condition,r in d["conditions"].items():
                  rows.append({
                      "label":label,"seed":int(seed),"condition":condition,
                      "final_energy":r["final_energy"],
                      "mean_energy":r["mean_energy"],
                      "contact":r["source_contact_fraction"],
                      "low":r["low_fraction"],"zero":r["zero_fraction"],
                      "rss":r["rss_max_mb"],
                  })

          summary={}
          paired=[]
          for label in sorted({r["label"] for r in rows}):
              summary[label]={}
              for condition in ("random_feed","field_feed","field_no_energy"):
                  rr=[r for r in rows if r["label"]==label and r["condition"]==condition]
                  summary[label][condition]={
                      "n":len(rr),
                      "survived":sum(x["final_energy"]>.25 for x in rr),
                      "final_energy_mean":statistics.mean(x["final_energy"] for x in rr),
                      "contact_mean":statistics.mean(x["contact"] for x in rr),
                      "low_mean":statistics.mean(x["low"] for x in rr),
                  }
              for seed in sorted({r["seed"] for r in rows if r["label"]==label}):
                  q={r["condition"]:r for r in rows if r["label"]==label and r["seed"]==seed}
                  paired.append({
                      "label":label,"seed":seed,
                      "field_survived":q["field_feed"]["final_energy"]>.25,
                      "random_survived":q["random_feed"]["final_energy"]>.25,
                      "no_energy_died":q["field_no_energy"]["final_energy"]<=.25,
                      "field_minus_random_energy":q["field_feed"]["final_energy"]-q["random_feed"]["final_energy"],
                      "field_minus_random_contact":q["field_feed"]["contact"]-q["random_feed"]["contact"],
                  })
          out={"positions":positions,"summary":summary,"paired":paired,"rows":rows}
          open("benchmark-output/reachable-summary.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          cp feed_v3/core.py feed_v3/world.py feed_v3/cuda_field.py feed_v3/run_feeding_cuda.py benchmark-output/
          sha256sum benchmark-output/core.py benchmark-output/world.py benchmark-output/cuda_field.py benchmark-output/run_feeding_cuda.py > benchmark-output/source.sha256

      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf nethra-reachable-source-feeding.tar.gz benchmark-output feed_v3

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-reachable-source-feeding
          path: nethra-reachable-source-feeding.tar.gz
          if-no-files-found: error
          retention-days: 7
