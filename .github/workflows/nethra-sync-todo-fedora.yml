name: Nethra sync TODO to Fedora

on:
  push:
    branches:
      - nethra-field-tension-investigation
    paths:
      - 'NETHRA_TODO.md'
      - 'NETHRA_MATHEMATICAL_ORIENTATION.md'
      - '.github/workflows/nethra-sync-todo-fedora.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Sync persistent TODO
        shell: bash
        run: |
          set -euxo pipefail
          test -d /home/dooces/Projects/20260918
          todo=/home/dooces/Projects/20260918/NETHRA_TODO.md
          orient=/home/dooces/Projects/20260918/NETHRA_MATHEMATICAL_ORIENTATION.md
          cp NETHRA_TODO.md "$todo"
          cp NETHRA_MATHEMATICAL_ORIENTATION.md "$orient"
          cmp -s NETHRA_TODO.md "$todo"
          cmp -s NETHRA_MATHEMATICAL_ORIENTATION.md "$orient"
          ls -l "$todo" "$orient"
          sha256sum NETHRA_TODO.md "$todo" NETHRA_MATHEMATICAL_ORIENTATION.md "$orient"
