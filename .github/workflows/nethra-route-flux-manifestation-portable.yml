name: Nethra route flux manifestation audit portable
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - '.github/workflows/nethra-route-flux-manifestation-portable.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          PYTHONPATH=. /usr/bin/time -f 'elapsed=%e maxrss_kb=%M' \
            /usr/bin/python3 nethra_route_flux_manifestation_audit.py
