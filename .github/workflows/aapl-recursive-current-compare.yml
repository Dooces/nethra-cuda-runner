name: AAPL recursive-current continuation comparison

on:
  push:
    branches:
      - nethra-aapl-recursive-current-event
    paths:
      - 'aapl_residual_recursive_native.py'
      - 'aapl_continuation_baselines.py'
      - '.github/workflows/aapl-recursive-current-compare.yml'
  workflow_dispatch:

jobs:
  compare:
    runs-on: self-hosted
    timeout-minutes: 4
    env:
      PYTHONHASHSEED: '0'
      NETHRA_COMPARE_TRAIN: '1200'
      NETHRA_COMPARE_ONLINE: '5000'
    steps:
      - uses: actions/checkout@v4
      - name: Recursive-current continuation comparison
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. /usr/bin/time -f 'RECURCURRENT elapsed=%e maxrss_kb=%M'             /usr/bin/python3 aapl_continuation_baselines.py
