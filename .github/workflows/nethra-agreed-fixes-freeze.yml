name: Nethra agreed fixes freeze

on:
  push:
    branches:
      - nethra-agreed-fixes-freeze-20260923
  workflow_dispatch:

jobs:
  freeze:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Frozen regressions
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/python3 --version
          PYTHONPATH=. /usr/bin/time -f 'elapsed=%e maxrss_kb=%M' \
            /usr/bin/python3 -m unittest -v \
              test_interval_boundary_freeze.py \
              test_subtraction_before_construction.py
