name: Nethra recursive route reinforcement trace
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_recursive_reinforcement_trace.py'
      - '.github/workflows/nethra-recursive-reinforcement-trace.yml'
  workflow_dispatch:
jobs:
  trace:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_recursive_reinforcement_trace.py
