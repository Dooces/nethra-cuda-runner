name: Nethra feed v3 source generalization

on:
  push:
    branches:
      - nethra-feed-v3-bounded
    paths:
      - '.github/workflows/nethra-feed-v3-source-generalization.yml'
  workflow_dispatch:

jobs:
  generalize:
    runs-on: self-hosted
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Host
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
          nvidia-smi
      - name: Compile and invariants
        shell: bash
        run: |
          set -euxo pipefail
          cd feed_v3
          /usr/bin/python3 -m py_compile core.py world.py cuda_field.py run_feeding_cuda.py test_bounded.py test_cuda.py
          PYTHONPATH=. /usr/bin/python3 test_bounded.py
          PYTHONPATH=. /usr/bin/python3 test_cuda.py
      - name: Multi-position multi-seed feeding
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output/generalization
          cd feed_v3
          run_capped() {
            "$@" &
            pid=$!
            while kill -0 "$pid" 2>/dev/null; do
              rss_kb=$(awk '/VmRSS:/ {print $2}' "/proc/$pid/status" 2>/dev/null || echo 0)
              if [ "${rss_kb:-0}" -gt 4194304 ]; then
                echo "RSS safety limit exceeded: ${rss_kb} KiB" >&2
                kill -TERM "$pid" 2>/dev/null || true
                sleep 1
                kill -KILL "$pid" 2>/dev/null || true
                wait "$pid" || true
                return 99
              fi
              sleep 1
            done
            wait "$pid"
          }
          positions=(
            "center 0.94 0.24"
            "left 0.72 0.22"
            "upper 1.08 0.50"
          )
          seeds=(22001 22002 22003)
          for spec in "${positions[@]}"; do
            read -r label sx sy <<< "$spec"
            for seed in "${seeds[@]}"; do
              out="../benchmark-output/generalization/${label}-${seed}.json"
              echo "=== $label seed=$seed source=($sx,$sy) ==="
              run_capped env PYTHONPATH=. /usr/bin/python3 run_feeding_cuda.py \
                --base ../benchmark-output/base_hand_ball_cuda.json \
                --steps 12000 \
                --checkpoint-every 12000 \
                --sample-rate 0.0625 \
                --proposal-budget 64 \
                --candidate-capacity 65536 \
                --persistence-floor 0.003 \
                --field-dt 0.1 \
                --basal-cost 0.00021 \
                --motor-cost 0.0000275 \
                --source-x "$sx" \
                --source-y "$sy" \
                --seed "$seed" \
                --out "$out"
            done
          done
          cd ..
      - name: Summarize
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/python3 - <<'PY'
          import json, glob, os, statistics
          files=sorted(glob.glob("benchmark-output/generalization/*.json"))
          rows=[]
          for p in files:
              d=json.load(open(p))
              base=os.path.basename(p)[:-5]
              label,seed=base.rsplit("-",1)
              for condition,r in d["conditions"].items():
                  rows.append({
                      "label":label,
                      "seed":int(seed),
                      "condition":condition,
                      "final_energy":r["final_energy"],
                      "mean_energy":r["mean_energy"],
                      "contact":r["source_contact_fraction"],
                      "low":r["low_fraction"],
                      "zero":r["zero_fraction"],
                      "motor":r["mean_motor_current"],
                      "rss":r["rss_max_mb"],
                      "constructed":r["constructed"],
                  })
          summary={}
          for label in sorted({r["label"] for r in rows}):
              summary[label]={}
              for condition in ("random_feed","field_feed","field_no_energy"):
                  rr=[r for r in rows if r["label"]==label and r["condition"]==condition]
                  summary[label][condition]={
                      "n":len(rr),
                      "final_energy_mean":statistics.mean(x["final_energy"] for x in rr),
                      "final_energy_min":min(x["final_energy"] for x in rr),
                      "mean_energy_mean":statistics.mean(x["mean_energy"] for x in rr),
                      "contact_mean":statistics.mean(x["contact"] for x in rr),
                      "low_mean":statistics.mean(x["low"] for x in rr),
                      "zero_mean":statistics.mean(x["zero"] for x in rr),
                      "survived":sum(x["final_energy"]>.25 for x in rr),
                  }
          paired=[]
          for label in sorted(summary):
              for seed in sorted({r["seed"] for r in rows if r["label"]==label}):
                  q={r["condition"]:r for r in rows if r["label"]==label and r["seed"]==seed}
                  paired.append({
                      "label":label,"seed":seed,
                      "field_minus_random_final_energy":q["field_feed"]["final_energy"]-q["random_feed"]["final_energy"],
                      "field_minus_random_contact":q["field_feed"]["contact"]-q["random_feed"]["contact"],
                      "field_survived":q["field_feed"]["final_energy"]>.25,
                      "random_survived":q["random_feed"]["final_energy"]>.25,
                      "no_energy_died":q["field_no_energy"]["final_energy"]<=.25,
                  })
          out={"summary":summary,"paired":paired,"rows":rows}
          open("benchmark-output/source-generalization-summary.json","w").write(json.dumps(out,indent=2,sort_keys=True)+"\n")
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
          cp feed_v3/core.py feed_v3/world.py feed_v3/cuda_field.py feed_v3/run_feeding_cuda.py benchmark-output/
          sha256sum benchmark-output/core.py benchmark-output/world.py benchmark-output/cuda_field.py benchmark-output/run_feeding_cuda.py > benchmark-output/source.sha256
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf nethra-feed-v3-source-generalization.tar.gz benchmark-output feed_v3
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-feed-v3-source-generalization
          path: nethra-feed-v3-source-generalization.tar.gz
          if-no-files-found: error
          retention-days: 7
