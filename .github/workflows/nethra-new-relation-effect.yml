name: Nethra new-relation behavioral effect

on:
  push:
    branches:
      - nethra-long-reach-dynamics
    paths:
      - '.github/workflows/nethra-new-relation-effect.yml'

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact primed checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf prior benchmark-output
          mkdir -p prior benchmark-output
          gh run download 35686582364 -n nethra-feed-v3-cuda-feeding -D prior
          tar -xzf prior/nethra-feed-v3-cuda-feeding.tar.gz -C prior
          cp prior/benchmark-output/base_hand_ball_cuda.json benchmark-output/base_hand_ball_cuda.json
      - name: Diagnose first learned checkpoint
        shell: bash
        run: |
          set -euxo pipefail
          cd feed_v3
          PYTHONPATH=. /usr/bin/python3 diagnose_new_relation_effect.py
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-new-relation-effect
          path: benchmark-output/new-relation-effect.json
          if-no-files-found: error
          retention-days: 7

# rerun after diagnostic fix
