name: Nethra recursive coupling factor

on:
  push:
    branches:
      - nethra-threshold-plasticity-audit
    paths:
      - 'recursive_coupling_factor_probe.py'
      - '.github/workflows/nethra-recursive-coupling-factor.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Recursive coupling factor probe
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. /usr/bin/time -f 'elapsed=%e maxrss_kb=%M' /usr/bin/python3 recursive_coupling_factor_probe.py
