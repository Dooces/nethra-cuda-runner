name: Nethra full field cycle audit
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_full_field_cycle_audit.py'
      - '.github/workflows/nethra-full-field-cycle-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_full_field_cycle_audit.py
