name: Nethra temporal route repair

on:
  push:
    branches:
      - nethra-temporal-route-repair
      - nethra-temporal-route-frozen
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Temporal route repair tests
        run: |
          set -euxo pipefail
          python3 -m py_compile nethra.py test_temporal_route_repair.py
          python3 -m unittest -v \
            test_temporal_route_repair.py \
            test_indexed_optimization_equivalence.py

  fedora:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Temporal route repair tests on Fedora
        run: |
          set -euxo pipefail
          /usr/bin/python3 -m py_compile nethra.py test_temporal_route_repair.py
          /usr/bin/python3 -m unittest -v \
            test_temporal_route_repair.py \
            test_indexed_optimization_equivalence.py
