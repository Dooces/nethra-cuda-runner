name: Nethra emergent resource-decay benchmark

on:
  push:
    paths:
      - 'bench/emergent_resource_decay.py'
      - '.github/workflows/nethra-emergent-resource.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Host identity
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          whoami
          /usr/bin/python3 --version
          uname -a
          nvidia-smi || true

      - name: Run Nethra resource/decay benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          /usr/bin/python3 bench/emergent_resource_decay.py             --epochs 8             --steps 15000             --out benchmark-output/emergent_resource_decay_results.json             | tee benchmark-output/stdout.txt

      - name: Bundle benchmark receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          cp bench/emergent_resource_decay.py benchmark-output/
          sha256sum bench/emergent_resource_decay.py > benchmark-output/source.sha256
          tar -czf nethra-emergent-resource-benchmark.tar.gz benchmark-output

      - name: Upload benchmark receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-emergent-resource-benchmark
          path: nethra-emergent-resource-benchmark.tar.gz
          if-no-files-found: error
          retention-days: 7
