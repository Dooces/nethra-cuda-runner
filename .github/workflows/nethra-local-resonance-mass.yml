name: Nethra local resonance mass

on:
  push:
    paths:
      - 'bench/local_resonance_mass.py'
      - '.github/workflows/nethra-local-resonance-mass.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Host identity
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          /usr/bin/python3 --version
          uname -a
          nvidia-smi || true
      - name: Run local resonance mass benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          cd benchmark-output
          PYTHONPATH=../bench /usr/bin/python3 ../bench/local_resonance_mass.py | tee stdout.txt
          cp ../bench/local_resonance_mass.py ../bench/fixed_budget_persistence.py .
          sha256sum local_resonance_mass.py fixed_budget_persistence.py > source.sha256
          cd ..
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf nethra-local-resonance-mass.tar.gz benchmark-output
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-local-resonance-mass
          path: nethra-local-resonance-mass.tar.gz
          if-no-files-found: error
          retention-days: 7
