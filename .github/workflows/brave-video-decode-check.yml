name: Brave NVIDIA video decode check

on:
  push:
    paths:
      - '.github/workflows/brave-video-decode-check.yml'

jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: Inspect Brave/NVIDIA video decode path
        shell: bash
        run: |
          set +e
          echo "=== GPU ==="
          nvidia-smi --query-gpu=name,driver_version,utilization.gpu,utilization.memory,utilization.encoder,utilization.decoder --format=csv
          echo
          echo "=== NVIDIA utilization samples ==="
          nvidia-smi dmon -s u -c 5
          echo
          echo "=== Brave GPU process ==="
          ps -eo pid,ppid,pcpu,pmem,args | grep '/opt/brave.com/brave/brave' | grep -- '--type=gpu-process' | grep -v grep
          echo
          echo "=== DRM render node ==="
          ls -l /dev/dri /dev/dri/by-path 2>/dev/null
          readlink -f /sys/class/drm/renderD128/device/driver 2>/dev/null
          udevadm info -q property -p /sys/class/drm/renderD128 2>/dev/null | grep -E 'DRIVER|PCI_ID|ID_PATH' || true
          echo
          echo "=== VAAPI / NVIDIA video packages ==="
          rpm -qa | grep -Ei 'nvidia|libva|vaapi|vdpau' | sort
          echo
          echo "=== vainfo ==="
          command -v vainfo || true
          vainfo --display drm --device /dev/dri/renderD128 2>&1 | head -120
          echo
          echo "=== vdpauinfo ==="
          command -v vdpauinfo || true
          vdpauinfo 2>&1 | head -100
          echo
          echo "=== Recent Brave GPU/video messages ==="
          journalctl --user --since '-2 hours' --no-pager 2>/dev/null | grep -Ei 'brave|vaapi|video.?decode|vulkan|nvidia' | tail -160
