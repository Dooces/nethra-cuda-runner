name: Kill hottest Brave renderer

on:
  push:
    paths:
      - '.github/workflows/kill-hot-brave-renderer.yml'

jobs:
  kill-renderer:
    runs-on: self-hosted
    steps:
      - name: Identify and kill hottest Brave renderer
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Brave renderers before ==="
          ps -eo pid=,ppid=,psr=,pcpu=,pmem=,etimes=,stat=,args= --sort=-pcpu             | grep '/opt/brave.com/brave/brave'             | grep -- '--type=renderer'             | head -20 || true

          pid="$(ps -eo pid=,pcpu=,args= --sort=-pcpu             | awk '/\/opt\/brave.com\/brave\/brave/ && /--type=renderer/ {print $1; exit}')"

          if [[ -z "$pid" ]]; then
            echo "No Brave renderer found"
            exit 1
          fi

          echo "TARGET_PID=$pid"
          echo "=== Target details ==="
          ps -p "$pid" -o pid,ppid,psr,pcpu,pmem,etimes,stat,args
          echo "=== /proc status ==="
          grep -E '^(Name|State|Pid|PPid|Threads|VmRSS|VmSize):' "/proc/$pid/status" || true

          kill -TERM "$pid"
          sleep 2
          if kill -0 "$pid" 2>/dev/null; then
            echo "Renderer survived TERM; sending KILL"
            kill -KILL "$pid"
            sleep 1
          fi

          if kill -0 "$pid" 2>/dev/null; then
            echo "FAILED_TO_KILL=$pid"
            exit 1
          fi

          echo "KILLED_PID=$pid"
          echo "=== Brave renderers after ==="
          ps -eo pid=,ppid=,psr=,pcpu=,pmem=,etimes=,stat=,args= --sort=-pcpu             | grep '/opt/brave.com/brave/brave'             | grep -- '--type=renderer'             | head -20 || true
