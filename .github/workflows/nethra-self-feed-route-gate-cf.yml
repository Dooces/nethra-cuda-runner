name: Nethra self feed route gating counterfactual
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_self_feed_route_gate_cf.py'
      - '.github/workflows/nethra-self-feed-route-gate-cf.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_self_feed_route_gate_cf.py
