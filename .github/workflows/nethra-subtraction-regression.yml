name: Nethra subtraction correction regression

on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra.py'
      - 'nethra_subtraction_regression.py'
      - '.github/workflows/nethra-subtraction-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Targeted subtraction regression
        shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_subtraction_regression.py
      - name: Frozen interval boundary
        shell: bash
        run: PYTHONPATH=. /usr/bin/python3 test_interval_boundary_freeze.py
      - name: Local field perspective
        shell: bash
        run: PYTHONPATH=. /usr/bin/python3 relation_local_perspective_probe.py
      - name: Continuous recursive handle plasticity
        shell: bash
        run: |
          PYTHONPATH=. /usr/bin/python3 - <<'PY'
          from continuous_recursive_handle_probe import learn_chain, direct_member_leaf_audit
          cold_field,cold=learn_chain(False)
          live_field,live=learn_chain(True)
          cold_depth=max((r["depth"] for r in cold if r["learned"]),default=0)
          live_depth=max((r["depth"] for r in live if r["learned"]),default=0)
          violations=direct_member_leaf_audit(live,live_field)
          print("cold_depth",cold_depth,"continuous_depth",live_depth,"leaf_route_violations",violations)
          assert cold_depth>=1
          assert live_depth>=cold_depth
          assert violations==0
          PY
      - name: Recursive depth
        shell: bash
        run: PYTHONPATH=. /usr/bin/python3 recursive_depth_gate_probe.py
      - name: Self feed
        shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_self_feed_probe.py
