name: Nethra phase support discrimination
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_phase_support_discrimination.py'
      - '.github/workflows/nethra-phase-support-discrimination.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          PYTHONPATH=. /usr/bin/time -f 'elapsed=%e maxrss_kb=%M' \
            /usr/bin/python3 nethra_phase_support_discrimination.py
