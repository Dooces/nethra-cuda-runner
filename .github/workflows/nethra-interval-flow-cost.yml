name: Nethra interval flow cost

on:
  push:
    branches:
      - nethra-field-tension-investigation
    paths:
      - 'interval_flow_cost_probe.py'
      - '.github/workflows/nethra-interval-flow-cost.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run interval flow cost benchmark
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
          PYTHONPATH=. /usr/bin/python3 interval_flow_cost_probe.py
