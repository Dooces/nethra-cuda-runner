name: Nethra mature current decomposition
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_mature_current_decomposition.py'
      - '.github/workflows/nethra-mature-current-decomposition.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_mature_current_decomposition.py
