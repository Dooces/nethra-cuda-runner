name: Nethra autonomous temporal graph isomorphism

on:
  push:
    branches:
      - nethra-field-tension-investigation
    paths:
      - 'autonomous_temporal_graph_isomorphism_probe.py'
      - '.github/workflows/nethra-autonomous-temporal-graph-isomorphism.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run autonomous temporal graph isomorphism probe
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          /usr/bin/python3 --version
          PYTHONPATH=. /usr/bin/python3 autonomous_temporal_graph_isomorphism_probe.py
