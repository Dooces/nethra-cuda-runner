name: Nethra feed v3 bounded pilot

on:
  push:
    branches:
      - nethra-feed-v3-bounded
    paths:
      - '.github/workflows/nethra-feed-v3-pilot.yml'
  workflow_dispatch:

jobs:
  pilot:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Host
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
          nvidia-smi || true
      - name: Compile and invariants
        shell: bash
        run: |
          set -euxo pipefail
          cd feed_v3
          /usr/bin/python3 -m py_compile core.py world.py run_feeding.py test_bounded.py
          PYTHONPATH=. /usr/bin/python3 test_bounded.py
      - name: Single-process feeding pilot
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          cd feed_v3
          /usr/bin/time -v env PYTHONPATH=. /usr/bin/python3 run_feeding.py             --base ../benchmark-output/base_hand_ball.json             --steps 12000             --checkpoint-every 12000             --sample-rate 0.0625             --proposal-budget 64             --candidate-capacity 65536             --persistence-floor 0.003             --seed 22001             --out ../benchmark-output/feeding-pilot.json             2>&1 | tee ../benchmark-output/feeding-pilot.txt
          cd ..
          cp feed_v3/core.py feed_v3/world.py feed_v3/run_feeding.py feed_v3/test_bounded.py benchmark-output/
          sha256sum benchmark-output/core.py benchmark-output/world.py benchmark-output/run_feeding.py benchmark-output/test_bounded.py > benchmark-output/source.sha256
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          tar -czf nethra-feed-v3-bounded-pilot.tar.gz benchmark-output feed_v3
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-feed-v3-bounded-pilot
          path: nethra-feed-v3-bounded-pilot.tar.gz
          if-no-files-found: error
          retention-days: 7

# conservative-field rerun
