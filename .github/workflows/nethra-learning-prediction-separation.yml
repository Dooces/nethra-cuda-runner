name: Nethra learning prediction separation

on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra.py'
      - 'nethra_admission_prediction_separation_probe.py'
      - '.github/workflows/nethra-learning-prediction-separation.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Admission and prediction kept separate
        shell: bash
        run: |
          PYTHONPATH=. /usr/bin/time -f 'elapsed=%e maxrss_kb=%M' \
            /usr/bin/python3 nethra_admission_prediction_separation_probe.py
