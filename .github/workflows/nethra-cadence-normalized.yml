name: Nethra cadence-normalized persistence

on:
  push:
    paths:
      - 'bench/cadence_normalized_decay.py'
      - '.github/workflows/nethra-cadence-normalized.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Host identity
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          /usr/bin/python3 --version
          uname -a
          nvidia-smi || true
      - name: Run cadence-normalized benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          /usr/bin/python3 bench/cadence_normalized_decay.py --total 120000 --out benchmark-output/cadence_normalized_decay.json | tee benchmark-output/stdout.txt
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          cp bench/cadence_normalized_decay.py benchmark-output/
          sha256sum bench/cadence_normalized_decay.py > benchmark-output/source.sha256
          tar -czf nethra-cadence-normalized.tar.gz benchmark-output
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-cadence-normalized
          path: nethra-cadence-normalized.tar.gz
          if-no-files-found: error
          retention-days: 7
