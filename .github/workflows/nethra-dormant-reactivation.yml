name: Nethra dormant reactivation

on:
  push:
    paths:
      - 'bench/dormant_reactivation.py'
      - '.github/workflows/nethra-dormant-reactivation.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Host identity
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          /usr/bin/python3 --version
          uname -a
          nvidia-smi || true
      - name: Run dormant reactivation benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          cd benchmark-output
          /usr/bin/python3 ../bench/dormant_reactivation.py | tee stdout.txt
          cp ../bench/dormant_reactivation.py .
          sha256sum dormant_reactivation.py > source.sha256
          cd ..
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf nethra-dormant-reactivation.tar.gz benchmark-output
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-dormant-reactivation
          path: nethra-dormant-reactivation.tar.gz
          if-no-files-found: error
          retention-days: 7
