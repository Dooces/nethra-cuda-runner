name: Nethra prediction support readout audit
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_prediction_support_readout_audit.py'
      - '.github/workflows/nethra-prediction-support-readout-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_prediction_support_readout_audit.py
