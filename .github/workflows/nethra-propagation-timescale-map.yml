name: Nethra propagation timescale map
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_propagation_timescale_map.py'
      - '.github/workflows/nethra-propagation-timescale-map.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_propagation_timescale_map.py
