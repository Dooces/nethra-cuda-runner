name: Nethra route application phase trace
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_route_application_phase_trace.py'
      - '.github/workflows/nethra-route-application-phase-trace.yml'
  workflow_dispatch:
jobs:
  trace:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_route_application_phase_trace.py
