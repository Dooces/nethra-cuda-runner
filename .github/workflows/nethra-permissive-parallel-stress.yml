name: Nethra permissive parallel stress

on:
  push:
    paths:
      - 'bench/permissive_parallel_stress.py'
      - '.github/workflows/nethra-permissive-parallel-stress.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Host identity
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          whoami
          nproc
          lscpu
          free -h
          /usr/bin/python3 --version
          uname -a
          nvidia-smi || true
          /usr/bin/python3 - <<'PY'
          try:
              import cupy
              print("cupy", cupy.__version__)
          except Exception as e:
              print("cupy unavailable", repr(e))
          PY
      - name: Run parallel permissive stress benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          cd benchmark-output
          PYTHONPATH=../bench /usr/bin/python3 ../bench/permissive_parallel_stress.py | tee stdout.txt
          cp ../bench/permissive_parallel_stress.py ../bench/permissive_lazy_decay.py ../bench/fixed_budget_persistence.py .
          sha256sum permissive_parallel_stress.py permissive_lazy_decay.py fixed_budget_persistence.py > source.sha256
          cd ..
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf nethra-permissive-parallel-stress.tar.gz benchmark-output
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-permissive-parallel-stress
          path: nethra-permissive-parallel-stress.tar.gz
          if-no-files-found: error
          retention-days: 7
