name: Nethra factorization repair

on:
  push:
    branches:
      - factorization-repair
      - nethra-factorization-frozen
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Factorization and temporal recursion tests
        run: |
          set -euxo pipefail
          python3 -m py_compile nethra.py test_factorization_repair.py test_temporal_route_repair.py
          python3 -m unittest -v test_factorization_repair.py test_temporal_route_repair.py

  fedora:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Factorization and temporal recursion tests on Fedora
        run: |
          set -euxo pipefail
          /usr/bin/python3 -m py_compile nethra.py test_factorization_repair.py test_temporal_route_repair.py
          /usr/bin/python3 -m unittest -v test_factorization_repair.py test_temporal_route_repair.py
