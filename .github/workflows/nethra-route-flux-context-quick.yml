name: Nethra route flux context quick
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_route_flux_context_quick.py'
      - '.github/workflows/nethra-route-flux-context-quick.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_route_flux_context_quick.py
