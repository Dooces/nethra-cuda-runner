name: Nethra autonomous temporal field expression

on:
  push:
    branches:
      - nethra-field-tension-investigation
    paths:
      - 'autonomous_temporal_field_expression_probe.py'
      - '.github/workflows/nethra-autonomous-temporal-field-expression.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          /usr/bin/python3 --version
          test -f /home/dooces/Projects/20260918/nethra_L75_learning_core_frozen.py
          test -f /home/dooces/Projects/20260918/nethra_F61_field_core_frozen.py
          sha256sum /home/dooces/Projects/20260918/nethra_L75_learning_core_frozen.py
          sha256sum /home/dooces/Projects/20260918/nethra_F61_field_core_frozen.py
      - name: Run autonomous temporal field expression probe
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=/home/dooces/Projects/20260918:/usr/lib64/python3.14/site-packages:/usr/lib/python3.14/site-packages             /usr/bin/python3 autonomous_temporal_field_expression_probe.py
