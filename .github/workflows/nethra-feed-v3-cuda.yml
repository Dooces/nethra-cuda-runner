name: Nethra feed v3 CUDA field

on:
  push:
    branches:
      - nethra-feed-v3-bounded
    paths:
      - 'feed_v3/cuda_field.py'
      - 'feed_v3/test_cuda.py'
      - '.github/workflows/nethra-feed-v3-cuda.yml'
  workflow_dispatch:

jobs:
  cuda:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Host
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
          nvidia-smi
      - name: CUDA equivalence and benchmark
        shell: bash
        run: |
          set -euxo pipefail
          ulimit -v 33554432
          mkdir -p benchmark-output
          cd feed_v3
          /usr/bin/time -v env PYTHONPATH=. /usr/bin/python3 test_cuda.py 2>&1 | tee ../benchmark-output/cuda-field.txt
          cd ..
          cp feed_v3/core.py feed_v3/cuda_field.py feed_v3/test_cuda.py benchmark-output/
          sha256sum benchmark-output/core.py benchmark-output/cuda_field.py benchmark-output/test_cuda.py > benchmark-output/source.sha256
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf nethra-feed-v3-cuda.tar.gz benchmark-output feed_v3
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-feed-v3-cuda
          path: nethra-feed-v3-cuda.tar.gz
          if-no-files-found: error
          retention-days: 7
