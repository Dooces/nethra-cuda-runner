name: Symbol context medium run

on:
  push:
    branches:
      - nethra-prospective-field-audit
    paths:
      - '.github/workflows/symbol-context-medium.yml'
  workflow_dispatch:

jobs:
  medium:
    runs-on: self-hosted
    timeout-minutes: 3
    env:
      PYTHONHASHSEED: '0'
      NETHRA_MULTI_CACHE: '/tmp/nethra_multisymbol_exact.json'
      NETHRA_SYMBOLS: 'AAPL,MSFT,NVDA,TSLA,JPM,XOM'
      NETHRA_BATCH_TRAIN: '600'
      NETHRA_BATCH_ONLINE: '100'
    steps:
      - uses: actions/checkout@v4
      - name: Medium simultaneous symbol-context run
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. /usr/bin/time -f 'MEDIUM elapsed=%e maxrss_kb=%M'             /usr/bin/python3 symbol_context_batch_probe.py
