name: Nethra native core stock replay

on:
  push:
    branches:
      - nethra-stock-native-core-replay
    paths:
      - 'nethra.py'
      - 'stock_native_core_replay.py'
      - '.github/workflows/nethra-native-core-stock-replay.yml'
  workflow_dispatch:

jobs:
  replay:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
          nvidia-smi || true
      - name: Native core replay
        shell: bash
        env:
          NETHRA_STOCK_POINTS: '2500'
          NETHRA_STOCK_REPLAYS: '5'
        run: |
          set -euxo pipefail
          PYTHONPATH=. /usr/bin/time -f 'elapsed=%e maxrss_kb=%M' /usr/bin/python3 stock_native_core_replay.py
