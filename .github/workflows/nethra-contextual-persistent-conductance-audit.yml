name: Nethra contextual persistent conductance audit
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_contextual_persistent_conductance_audit.py'
      - '.github/workflows/nethra-contextual-persistent-conductance-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_contextual_persistent_conductance_audit.py
