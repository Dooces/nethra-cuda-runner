name: Nethra p0 frozen-learning control

on:
  push:
    branches:
      - nethra-long-reach-dynamics
    paths:
      - '.github/workflows/nethra-p0-frozen-control.yml'

jobs:
  control:
    runs-on: self-hosted
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Reuse exact primed hand-ball checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf prior benchmark-output
          mkdir -p prior benchmark-output
          gh run download 35686582364 -n nethra-feed-v3-cuda-feeding -D prior
          tar -xzf prior/nethra-feed-v3-cuda-feeding.tar.gz -C prior
          cp prior/benchmark-output/base_hand_ball_cuda.json benchmark-output/base_hand_ball_cuda.json
      - name: Frozen graph field-feed control
        shell: bash
        run: |
          set -euxo pipefail
          cd feed_v3
          env PYTHONPATH=. /usr/bin/python3 - <<'PY' > ../benchmark-output/p0-frozen.txt
          import json
          from pathlib import Path
          from run_feeding_cuda import run_condition
          r=run_condition(
              "../benchmark-output/base_hand_ball_cuda.json",
              seed=25001,
              use_field_outputs=True,
              feed_rate=.0045,
              basal_cost=.00021,
              motor_cost=.0000275,
              source_x=1.02,
              source_y=.06,
              steps=60000,
              checkpoint_every=60000,
              sample_rate=.0625,
              proposal_budget=64,
              candidate_capacity=65536,
              persistence_floor=.003,
              field_dt=.1,
          )
          Path("../benchmark-output/p0-frozen.json").write_text(json.dumps(r,indent=2,sort_keys=True)+"\n")
          print(json.dumps({k:v for k,v in r.items() if k!="checkpoints"},indent=2,sort_keys=True))
          PY
      - name: Bundle
        if: always()
        shell: bash
        run: tar -czf nethra-p0-frozen-control.tar.gz benchmark-output feed_v3
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-p0-frozen-control
          path: nethra-p0-frozen-control.tar.gz
          if-no-files-found: error
          retention-days: 7
