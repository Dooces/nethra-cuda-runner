name: AAPL native sensitive field balance
on:
  push:
    branches:
      - nethra-aapl-sensitive-field-balance
  workflow_dispatch:
jobs:
  test:
    runs-on: self-hosted
    timeout-minutes: 8
    env:
      PYTHONHASHSEED: '0'
      NETHRA_BAL_TRAIN: '1200'
      NETHRA_BAL_ONLINE: '10000'
    steps:
      - uses: actions/checkout@v4
      - name: Run balance audit
        shell: bash
        run: PYTHONPATH=. /usr/bin/python3 aapl_native_sensitive_balance.py
