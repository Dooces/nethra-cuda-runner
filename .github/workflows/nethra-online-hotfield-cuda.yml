name: Nethra online hot-field CUDA

on:
  push:
    paths:
      - 'bench/online_hotfield_gpu.py'
      - '.github/workflows/nethra-online-hotfield-cuda.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Host identity
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          /usr/bin/python3 --version
          nvidia-smi || true
      - name: Run online hot-field CUDA benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          cd benchmark-output
          PYTHONPATH=../bench /usr/bin/python3 ../bench/online_hotfield_gpu.py | tee stdout.txt
          cp ../bench/online_hotfield_gpu.py ../bench/fixed_budget_persistence.py .
          sha256sum online_hotfield_gpu.py fixed_budget_persistence.py > source.sha256
          cd ..
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf nethra-online-hotfield-cuda.tar.gz benchmark-output
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-online-hotfield-cuda
          path: nethra-online-hotfield-cuda.tar.gz
          if-no-files-found: error
          retention-days: 7
