name: Nethra phase observability runtime audit
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_phase_observability_runtime_audit.py'
      - '.github/workflows/nethra-phase-observability-runtime-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_phase_observability_runtime_audit.py
