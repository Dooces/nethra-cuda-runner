name: Nethra field tension probe

on:
  push:
    branches:
      - nethra-field-tension-investigation
    paths:
      - 'nethra.py'
      - 'field_tension_probe.py'
      - 'field_residual_probe.py'
      - 'field_local_plasticity_probe.py'
      - 'interval_integrated_perspective_probe.py'
      - 'positive_flow_tension_probe.py'
      - 'tension_trace_f61_probe.py'
      - 'all_incidence_residual_probe.py'
      - 'local_incidence_plasticity_probe.py'
      - 'relation_local_perspective_probe.py'
      - '.github/workflows/nethra-field-tension-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
      - name: Run field tension probe
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. /usr/bin/python3 field_tension_probe.py
          PYTHONPATH=. /usr/bin/python3 field_residual_probe.py
          PYTHONPATH=. /usr/bin/python3 field_local_plasticity_probe.py || true
          PYTHONPATH=. /usr/bin/python3 interval_integrated_perspective_probe.py
          PYTHONPATH=. /usr/bin/python3 positive_flow_tension_probe.py
          PYTHONPATH=. /usr/bin/python3 tension_trace_f61_probe.py
          PYTHONPATH=. /usr/bin/python3 all_incidence_residual_probe.py
          PYTHONPATH=. /usr/bin/python3 local_incidence_plasticity_probe.py
          PYTHONPATH=. /usr/bin/python3 relation_local_perspective_probe.py
