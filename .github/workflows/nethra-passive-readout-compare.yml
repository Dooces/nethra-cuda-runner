name: Nethra passive readout comparison
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_passive_readout_compare.py'
      - '.github/workflows/nethra-passive-readout-compare.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          PYTHONPATH=. /usr/bin/time -f 'elapsed=%e maxrss_kb=%M' \
            /usr/bin/python3 nethra_passive_readout_compare.py
