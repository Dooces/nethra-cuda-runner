name: Chat hang diagnostic

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: self-hosted
    steps:
      - name: Browser and system diagnostics
        shell: bash
        run: |
          set +e
          echo "=== NOW ==="
          date
          echo "=== UPTIME / LOAD ==="
          uptime
          echo "=== MEMORY ==="
          free -h
          echo "=== TOP BRAVE/CHROMIUM PROCESSES BY RSS ==="
          ps -eo pid,ppid,%cpu,%mem,rss,etimes,stat,comm,args --sort=-rss             | grep -Ei 'brave|chrom(e|ium)'             | grep -v grep             | head -40
          echo "=== PROCESS COUNTS ==="
          printf 'brave/chromium processes: '
          ps -eo comm= | grep -Eic 'brave|chrom(e|ium)'
          echo "=== RECENT USER JOURNAL BROWSER/OOM/CRASH LINES ==="
          journalctl --user --since '-30 min' --no-pager 2>/dev/null             | grep -Ei 'brave|chrom(e|ium)|oom|out of memory|segfault|gpu process|renderer|crash'             | tail -120
          echo "=== RECENT SYSTEM OOM LINES ==="
          journalctl --since '-30 min' --no-pager 2>/dev/null             | grep -Ei 'oom|out of memory|killed process|segfault'             | tail -80
          echo "=== BRAVE CRASH REPORT METADATA ==="
          find "$HOME/.config/BraveSoftware/Brave-Browser/Crash Reports" -maxdepth 2 -type f -mmin -60             -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null             | sort | tail -40
