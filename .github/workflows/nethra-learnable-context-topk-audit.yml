name: Nethra learnable contextual topk audit
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_learnable_context_topk_audit.py'
      - '.github/workflows/nethra-learnable-context-topk-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          PYTHONPATH=. /usr/bin/time -f 'elapsed=%e maxrss_kb=%M' \
            /usr/bin/python3 nethra_learnable_context_topk_audit.py
