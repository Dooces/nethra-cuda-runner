name: Symbol context batch probe

on:
  push:
    branches:
      - nethra-prospective-field-audit
    paths:
      - 'symbol_context_batch_probe.py'
      - '.github/workflows/symbol-context-batch.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 2
    env:
      PYTHONHASHSEED: '0'
      NETHRA_MULTI_CACHE: '/tmp/nethra_multisymbol_exact.json'
      NETHRA_SYMBOLS: 'AAPL,MSFT,NVDA,TSLA,JPM,XOM'
      NETHRA_BATCH_TRAIN: '120'
      NETHRA_BATCH_ONLINE: '10'
    steps:
      - uses: actions/checkout@v4
      - name: Per-symbol simultaneous construction
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. /usr/bin/time -f 'BATCH elapsed=%e maxrss_kb=%M'             /usr/bin/python3 symbol_context_batch_probe.py
