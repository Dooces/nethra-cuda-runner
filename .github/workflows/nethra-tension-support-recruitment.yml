name: Nethra tension support recruitment

on:
  push:
    branches:
      - nethra-field-tension-investigation
    paths:
      - 'tension_support_recruitment_probe.py'
      - '.github/workflows/nethra-tension-support-recruitment.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run tension support recruitment probe
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          /usr/bin/python3 --version
          PYTHONPATH=. /usr/bin/python3 tension_support_recruitment_probe.py
