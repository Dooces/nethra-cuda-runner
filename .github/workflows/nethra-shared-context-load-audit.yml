name: Nethra shared context load audit
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_shared_context_load_audit.py'
      - '.github/workflows/nethra-shared-context-load-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_shared_context_load_audit.py
