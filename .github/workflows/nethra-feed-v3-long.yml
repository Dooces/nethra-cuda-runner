name: Nethra feed v3 prolonged continuation

on:
  push:
    branches:
      - nethra-feed-v3-bounded
    paths:
      - '.github/workflows/nethra-feed-v3-long.yml'
  workflow_dispatch:

jobs:
  long:
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Host
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
          nvidia-smi
      - name: Reuse exact primed hand-ball checkpoint
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          rm -rf prior benchmark-output
          mkdir -p prior benchmark-output
          gh run download 35686582364 -n nethra-feed-v3-cuda-feeding -D prior
          tar -xzf prior/nethra-feed-v3-cuda-feeding.tar.gz -C prior
          cp prior/benchmark-output/base_hand_ball_cuda.json benchmark-output/base_hand_ball_cuda.json
          ls -lh benchmark-output/base_hand_ball_cuda.json
      - name: Prolonged continuous feeding
        shell: bash
        run: |
          set -euxo pipefail
          ulimit -v 8388608
          cd feed_v3
          /usr/bin/time -v env PYTHONPATH=. /usr/bin/python3 run_feeding_cuda.py             --base ../benchmark-output/base_hand_ball_cuda.json             --steps 60000             --checkpoint-every 12000             --sample-rate 0.0625             --proposal-budget 64             --candidate-capacity 65536             --persistence-floor 0.003             --field-dt 0.1             --seed 22001             --out ../benchmark-output/feeding-long.json             2>&1 | tee ../benchmark-output/feeding-long.txt
          cd ..
          cp feed_v3/core.py feed_v3/world.py feed_v3/cuda_field.py feed_v3/run_feeding_cuda.py benchmark-output/
          sha256sum benchmark-output/core.py benchmark-output/world.py benchmark-output/cuda_field.py benchmark-output/run_feeding_cuda.py > benchmark-output/source.sha256
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf nethra-feed-v3-long.tar.gz benchmark-output feed_v3
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-feed-v3-long
          path: nethra-feed-v3-long.tar.gz
          if-no-files-found: error
          retention-days: 7
