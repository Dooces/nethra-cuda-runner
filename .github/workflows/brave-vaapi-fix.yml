name: Fix Brave NVIDIA video decode

on:
  push:
    paths:
      - '.github/workflows/brave-vaapi-fix.yml'

jobs:
  fix:
    runs-on: self-hosted
    steps:
      - name: Install NVIDIA VAAPI bridge and configure Brave
        shell: bash
        run: |
          set -euxo pipefail

          sudo -n dnf -y install libva-nvidia-driver libva-utils

          echo "=== NVIDIA DRM modeset ==="
          cat /sys/module/nvidia_drm/parameters/modeset

          echo "=== VAAPI driver smoke test ==="
          LIBVA_DRIVER_NAME=nvidia NVD_BACKEND=direct             vainfo --display drm --device /dev/dri/renderD128

          mkdir -p "$HOME/.local/bin" "$HOME/.local/share/applications"

          cat > "$HOME/.local/bin/brave-browser-stable-vaapi" <<'EOF'
          #!/usr/bin/env bash
          export LIBVA_DRIVER_NAME=nvidia
          export NVD_BACKEND=direct
          exec /usr/bin/brave-browser-stable             --enable-features=AcceleratedVideoDecodeLinuxGL,VaapiOnNvidiaGPUs             --ignore-gpu-blocklist             --use-gl=angle             --use-angle=gl             --ozone-platform=wayland             "$@"
          EOF
          chmod 0755 "$HOME/.local/bin/brave-browser-stable-vaapi"

          if [[ -f "$HOME/.local/share/applications/brave-browser.desktop" ]]; then
            cp -a "$HOME/.local/share/applications/brave-browser.desktop"               "$HOME/.local/share/applications/brave-browser.desktop.pre-vaapi"
          fi

          cp /usr/share/applications/brave-browser.desktop             "$HOME/.local/share/applications/brave-browser.desktop"

          sed -i "s#Exec=/usr/bin/brave-browser-stable#Exec=$HOME/.local/bin/brave-browser-stable-vaapi#g"             "$HOME/.local/share/applications/brave-browser.desktop"

          update-desktop-database "$HOME/.local/share/applications" || true

          echo "=== Installed bridge ==="
          rpm -q libva-nvidia-driver libva-utils
          echo "=== Wrapper ==="
          cat "$HOME/.local/bin/brave-browser-stable-vaapi"
          echo "=== Desktop Exec lines ==="
          grep '^Exec=' "$HOME/.local/share/applications/brave-browser.desktop"
