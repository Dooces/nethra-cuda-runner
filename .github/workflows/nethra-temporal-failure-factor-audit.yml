name: Nethra temporal failure factor audit
on:
  push:
    branches: [nethra-self-feed-audit]
    paths:
      - 'nethra_temporal_failure_factor_audit.py'
      - '.github/workflows/nethra-temporal-failure-factor-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: PYTHONPATH=. /usr/bin/python3 nethra_temporal_failure_factor_audit.py
