name: Nethra feed v3 bounded invariants

on:
  push:
    branches:
      - nethra-feed-v3-bounded
    paths:
      - 'feed_v3/**'
      - '.github/workflows/nethra-feed-v3-bounded.yml'
  workflow_dispatch:

jobs:
  bounded:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Host
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
          nvidia-smi || true
      - name: Bounded locality and RSS invariants
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          cd feed_v3
          /usr/bin/time -v env PYTHONPATH=. /usr/bin/python3 test_bounded.py 2>&1 | tee ../benchmark-output/bounded-test.txt
          cd ..
          cp feed_v3/core.py feed_v3/world.py feed_v3/test_bounded.py benchmark-output/
          sha256sum benchmark-output/core.py benchmark-output/world.py benchmark-output/test_bounded.py > benchmark-output/source.sha256
      - name: Persistent graph RSS stress
        shell: bash
        run: |
          set -euxo pipefail
          cd feed_v3
          /usr/bin/time -v env PYTHONPATH=. /usr/bin/python3 stress_persistent.py 2>&1 | tee ../benchmark-output/persistent-stress.txt
          cd ..
          cp feed_v3/stress_persistent.py benchmark-output/
          sha256sum benchmark-output/stress_persistent.py >> benchmark-output/source.sha256
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          tar -czf nethra-feed-v3-bounded-invariants.tar.gz benchmark-output feed_v3
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-feed-v3-bounded-invariants
          path: nethra-feed-v3-bounded-invariants.tar.gz
          if-no-files-found: error
          retention-days: 7
