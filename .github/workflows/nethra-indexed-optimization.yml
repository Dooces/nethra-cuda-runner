name: Nethra indexed optimization equivalence

on:
  push:
    branches:
      - nethra-indexed-optimizations-test
      - nethra-indexed-optimizations-frozen
  workflow_dispatch:

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen-baseline equivalence and regressions
        shell: bash
        run: |
          set -euxo pipefail
          python3 --version
          PYTHONPATH=. python3 -m unittest -v \
            test_indexed_optimization_equivalence.py \
            test_historical_regression_parity.py
      - name: Optimization benchmark
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. python3 benchmark_indexed_optimizations.py

  fedora:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Frozen-baseline equivalence and regressions
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/python3 --version
          PYTHONPATH=. /usr/bin/python3 -m unittest -v \
            test_indexed_optimization_equivalence.py \
            test_historical_regression_parity.py
      - name: Optimization benchmark
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. /usr/bin/python3 benchmark_indexed_optimizations.py
