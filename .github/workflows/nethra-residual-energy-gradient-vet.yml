name: Nethra residual energy gradient vet

on:
  push:
    branches:
      - nethra-field-tension-investigation
    paths:
      - 'residual_energy_gradient_vet.py'
      - '.github/workflows/nethra-residual-energy-gradient-vet.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
      - name: Run residual-energy derivation vet
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. /usr/bin/python3 residual_energy_gradient_vet.py
