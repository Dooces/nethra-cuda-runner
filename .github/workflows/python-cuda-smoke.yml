name: Python CUDA smoke

on:
  workflow_dispatch:

jobs:
  python-cuda:
    runs-on: self-hosted
    steps:
      - name: Python CUDA stack
        run: |
          echo "python=$(command -v python3)"
          python3 --version
          python3 - <<'PY'
          import importlib.util
          mods = ["cupy", "numba", "torch"]
          for m in mods:
              print(f"{m}: {'present' if importlib.util.find_spec(m) else 'missing'}")
          if importlib.util.find_spec("cupy"):
              import cupy as cp
              print("cupy_devices:", cp.cuda.runtime.getDeviceCount())
              print("cupy_device_name:", cp.cuda.runtime.getDeviceProperties(0)["name"].decode())
              x = cp.arange(10, dtype=cp.float32)
              print("cupy_sum:", float(x.sum().get()))
          if importlib.util.find_spec("numba"):
              from numba import cuda
              print("numba_cuda_available:", cuda.is_available())
              if cuda.is_available():
                  print("numba_gpu:", cuda.get_current_device().name)
          if importlib.util.find_spec("torch"):
              import torch
              print("torch_cuda_available:", torch.cuda.is_available())
              if torch.cuda.is_available():
                  print("torch_gpu:", torch.cuda.get_device_name(0))
          PY
