name: Nethra efficient plasticity suite

on:
  push:
    branches:
      - nethra-threshold-plasticity-audit
    paths:
      - 'threshold_plasticity_audit.py'
      - 'weak_relation_loading_probe.py'
      - 'recursive_depth_gate_probe.py'
      - '.github/workflows/nethra-threshold-plasticity-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
      - name: Efficient plasticity suite
        shell: bash
        run: |
          set -euxo pipefail
          echo "=== threshold sweep ==="
          PYTHONPATH=. /usr/bin/time -f 'threshold_elapsed=%e maxrss_kb=%M' /usr/bin/python3 threshold_plasticity_audit.py
          echo "=== weak-relation loading ==="
          PYTHONPATH=. /usr/bin/time -f 'loading_elapsed=%e maxrss_kb=%M' /usr/bin/python3 weak_relation_loading_probe.py
          echo "=== true recursive depth ==="
          PYTHONPATH=. /usr/bin/time -f 'depth_elapsed=%e maxrss_kb=%M' /usr/bin/python3 recursive_depth_gate_probe.py
