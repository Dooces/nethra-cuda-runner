name: Nethra per-incidence resolution

on:
  push:
    branches:
      - nethra-field-tension-investigation
    paths:
      - 'per_incidence_resolution_probe.py'
      - '.github/workflows/nethra-per-incidence-resolution.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
      - name: Run per-incidence resolution probe
        shell: bash
        run: |
          set -euxo pipefail
          PYTHONPATH=. /usr/bin/python3 per_incidence_resolution_probe.py
