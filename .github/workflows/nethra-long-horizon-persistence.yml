name: Nethra long-horizon persistence

on:
  push:
    paths:
      - 'bench/long_horizon_persistence.py'
      - '.github/workflows/nethra-long-horizon-persistence.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Host identity
        shell: bash
        run: |
          set -euxo pipefail
          hostname
          nproc
          free -h
          /usr/bin/python3 --version
          nvidia-smi || true
      - name: Run long-horizon persistence benchmark
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p benchmark-output
          cd benchmark-output
          PYTHONPATH=../bench /usr/bin/python3 ../bench/long_horizon_persistence.py | tee stdout.txt
          cp ../bench/long_horizon_persistence.py ../bench/permissive_lazy_decay.py ../bench/fixed_budget_persistence.py .
          sha256sum long_horizon_persistence.py permissive_lazy_decay.py fixed_budget_persistence.py > source.sha256
          cd ..
      - name: Bundle receipt
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          tar -czf nethra-long-horizon-persistence.tar.gz benchmark-output
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nethra-long-horizon-persistence
          path: nethra-long-horizon-persistence.tar.gz
          if-no-files-found: error
          retention-days: 7
